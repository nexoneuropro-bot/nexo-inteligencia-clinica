name: NEXO pesquisa smoke test
'on':
  push:
    branches:
      - feat/experiencia-imersiva
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Conferir contato e apoio restrito publicado
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://nexo-previa-20261014.pages.dev"
          for i in $(seq 1 12); do
            HOME=$(curl -fsSL --max-time 15 "$BASE/" || true)
            CONTACT=$(curl -fsSL --max-time 15 "$BASE/contato/" || true)
            SURVEY=$(curl -fsSL --max-time 15 "$BASE/pesquisa/relacionamento-aberto/" || true)
            CLINIC=$(curl -fsSL --max-time 15 "$BASE/conhecendo-meu-momento/responder/" || true)
            echo "Marcadores: home_form=$([[ "$HOME" == *'id="nexo-contact-form"'* ]] && echo sim || echo nao) contato_form=$([[ "$CONTACT" == *'id="nexo-contact-form"'* ]] && echo sim || echo nao) pesquisa_sem_aviso=$([[ "$SURVEY" != *'class="nexo-support"'* ]] && echo sim || echo nao) clinica_com_aviso=$([[ "$CLINIC" == *'class="nexo-support"'* ]] && echo sim || echo nao) clinica_hidden=$([[ "$CLINIC" == *'class="nexo-support" hidden'* ]] && echo sim || echo nao)"
            if [[ "$HOME" == *'id="nexo-contact-form"'* ]] && [[ "$CONTACT" == *'id="nexo-contact-form"'* ]] && [[ "$SURVEY" != *'class="nexo-support"'* ]] && [[ "$CLINIC" == *'class="nexo-support"'* ]]; then
              echo "Contato na home e página de contato; apoio ausente da pesquisa e inicialmente oculto na experiência clínica."
              exit 0
            fi
            echo "Tentativa $i: alterações de contato/apoio ainda não confirmadas."
            sleep 12
          done
          echo "::error::A nova versão de contato/apoio não pôde ser confirmada no domínio da prévia."
          exit 1
      - name: Conferir versão publicada sem coletar respostas
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://nexo-previa-20261014.pages.dev"
          for i in $(seq 1 12); do
            PAGE=$(curl -fsSL --max-time 15 "$BASE/pesquisa/relacionamento-aberto/" || true)
            if echo "$PAGE" | grep -q 'data-relation-survey' && echo "$PAGE" | grep -q 'id="or-orientacao-consent"' && echo "$PAGE" | grep -q 'or-consent-info'; then
              CODE=$(curl -sSL --max-time 15 -o /tmp/nexo-status.json -w '%{http_code}' "$BASE/api/pesquisa-relacionamento/status" || true)
              echo "Resposta da API HTTP: $CODE"
              if [ "$CODE" = "200" ] || [ "$CODE" = "503" ]; then
                if python3 -c 'import json; d=json.load(open("/tmp/nexo-status.json")); assert d.get("open") is False and d.get("consentVersion")=="nexo-relacionamento-aberto-consent-2026-11-12-v3"'; then
                  echo "Formulário e API confirmados; coleta fechada."
                  exit 0
                fi
              fi
            fi
            echo "Tentativa $i: publicação ainda não comprovada."
            sleep 12
          done
          echo "::error::Não foi possível confirmar formulário e API na prévia."
          exit 1
