name: NEXO pesquisa smoke test
'on':
  push:
    branches:
      - feat/experiencia-imersiva
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Conferir contato e apoio restrito publicado
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://nexo-previa-20261014.pages.dev"
          HOME_OK=0
          CONTACT_OK=0
          CLINIC_OK=0
          SURVEY_OK=0
          for i in $(seq 1 8); do
            HOME=$(curl -fsSL --retry 2 --retry-delay 1 --max-time 15 "$BASE/" 2>/dev/null || true)
            if [[ "$HOME" == *'id="nexo-contact-form"'* ]]; then HOME_OK=1; fi

            CONTACT=$(curl -fsSL --retry 2 --retry-delay 1 --max-time 15 "$BASE/contato/" 2>/dev/null || true)
            if [[ "$CONTACT" == *'id="nexo-contact-form"'* ]]; then CONTACT_OK=1; fi

            SURVEY=$(curl -fsSL --retry 2 --retry-delay 1 --max-time 15 "$BASE/pesquisa/relacionamento-aberto/" 2>/dev/null || true)
            if [[ "$SURVEY" == *'data-relation-survey'* ]] && [[ "$SURVEY" != *'class="nexo-support"'* ]]; then SURVEY_OK=1; fi

            CLINIC=$(curl -fsSL --retry 2 --retry-delay 1 --max-time 15 "$BASE/conhecendo-meu-momento/responder/" 2>/dev/null || true)
            if [[ "$CLINIC" == *'class="nexo-support" hidden'* ]]; then CLINIC_OK=1; fi

            echo "Tentativa $i: home=$HOME_OK contato=$CONTACT_OK pesquisa_sem_aviso=$SURVEY_OK clinica_aviso_oculto=$CLINIC_OK"
            if [[ "$HOME_OK" == "1" && "$CONTACT_OK" == "1" && "$SURVEY_OK" == "1" && "$CLINIC_OK" == "1" ]]; then
              echo "PUBLICAÇÃO CONFIRMADA: contato nas duas páginas, pesquisa sem aviso e rastreio com aviso inicialmente oculto."
              exit 0
            fi
            sleep 8
          done
          echo "::error::Não foi possível observar todas as páginas atualizadas em verificações independentes."
          exit 1
      - name: Conferir versão publicada sem coletar respostas
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://nexo-previa-20261014.pages.dev"
          for i in $(seq 1 12); do
            PAGE=$(curl -fsSL --max-time 15 "$BASE/pesquisa/relacionamento-aberto/" || true)
            if echo "$PAGE" | grep -q 'data-relation-survey' && echo "$PAGE" | grep -q 'id="or-orientacao-consent"' && echo "$PAGE" | grep -q 'or-consent-info'; then
              CODE=$(curl -sSL --max-time 15 -o /tmp/nexo-status.json -w '%{http_code}' "$BASE/api/pesquisa-relacionamento/status" || true)
              echo "Resposta da API HTTP: $CODE"
              if [ "$CODE" = "200" ] || [ "$CODE" = "503" ]; then
                if python3 -c 'import json; d=json.load(open("/tmp/nexo-status.json")); assert d.get("open") is False and d.get("consentVersion")=="nexo-relacionamento-aberto-consent-2026-11-12-v3"'; then
                  echo "Formulário e API confirmados; coleta fechada."
                  exit 0
                fi
              fi
            fi
            echo "Tentativa $i: publicação ainda não comprovada."
            sleep 12
          done
          echo "::error::Não foi possível confirmar formulário e API na prévia."
          exit 1
