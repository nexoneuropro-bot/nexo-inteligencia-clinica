name: Conferir prévia NEXO publicada

on:
  push:
    branches: [feat/experiencia-imersiva]
    paths:
      - '.github/workflows/nexo-preview-smoke.yml'
      - 'src/scripts/momento-professional.ts'
      - 'src/scripts/momento-report-view.ts'
      - 'src/lib/momento-professional-report.ts'
      - 'src/lib/momento-clinical-interview-guide.ts'
      - 'src/scripts/momento-clinical-guide-view.ts'
      - 'src/components/MomentoProfessional.astro'
      - 'src/components/MomentoClinical.astro'
      - 'src/scripts/momento-clinical.ts'
      - 'src/scripts/momento-on-device-voice.ts'
      - 'src/data/momento-reflections.ts'
      - 'astro.config.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  confirmar-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Conferir página pública e versão do script profissional
        env:
          NEXO_PREVIEW: https://nexo-previa-20261014.pages.dev/nexo-profissional/
        run: |
          python3 - <<'PY'
          import os, re, time, urllib.parse, urllib.request
          from html.parser import HTMLParser

          class Assets(HTMLParser):
              def __init__(self): super().__init__(); self.urls = []
              def handle_starttag(self, name, attrs):
                  attrs = dict(attrs)
                  url = attrs.get("src") if name == "script" else attrs.get("href") if name == "link" and attrs.get("rel") == "modulepreload" else None
                  if url and ".js" in url: self.urls.append(url)

          def get(url):
              req = urllib.request.Request(url, headers={"User-Agent":"NEXO-preview-static-smoke/1.0"})
              with urllib.request.urlopen(req, timeout=14) as response:
                  return response.read().decode("utf-8")

          page = os.environ["NEXO_PREVIEW"]
          expected = "Síntese integrada para a entrevista"
          for attempt in range(1,6):
              try:
                  html = get(page)
                  if "Conhecendo Meu Momento" not in html and "NEXO" not in html.upper():
                      raise RuntimeError("A página recebida não parece ser NEXO")
                  parser = Assets(); parser.feed(html)
                  assets = list(dict.fromkeys(urllib.parse.urljoin(page, item) for item in parser.urls))
                  if not assets: raise RuntimeError("Nenhum script encontrado na página")
                  # O relatório pode importar blocos JS separados após o build.
                  queue=list(assets);seen=set();chunks=[]
                  while queue and len(seen)<35:
                      asset=queue.pop(0)
                      if asset in seen or not asset.startswith('https://nexo-previa-20261014.pages.dev/_astro/'): continue
                      seen.add(asset)
                      source=get(asset);chunks.append((asset,source))
                      for dep in re.findall(r"""['"]([^'"]+\.js)['"]""",source):
                          url=urllib.parse.urljoin(asset,dep)
                          if url not in seen and url not in queue:queue.append(url)
                  combined='\\n'.join(source for _,source in chunks)
                  expected_terms=[expected,'Por onde começar, o que investigar e como continuar']
                  if all(term in combined for term in expected_terms):
                      print('PUBLICAÇÃO CONFIRMADA: síntese integrada e novo guia clínico estão nos assets:')
                      for asset,source in chunks:
                          if any(term in source for term in expected_terms):print(asset)
                      print('Verificação somente de assets estáticos. Não consulta prontuários ou login.')
                      break
                  raise RuntimeError("Prévia respondeu, mas ainda não contém a versão integrada")
              except Exception as error:
                  print(f"Tentativa {attempt}/5: {error}")
                  if attempt == 5: raise
                  time.sleep(8)
          PY

      - name: Confirmar escolha de percurso e permissão restrita de microfone
        run: |
          python3 - <<'PY'
          import time, urllib.request
          base='https://nexo-previa-20261014.pages.dev'
          for attempt in range(1,7):
              try:
                  with urllib.request.urlopen(base+'/conhecendo-meu-momento/responder/',timeout=14) as r:
                      participant=r.read().decode('utf-8')
                      policy=r.headers.get('Permissions-Policy','')
                  if 'mc-choice-title' not in participant or 'mc-reflection-text' not in participant or 'mc-reflection-topics' not in participant or 'mc-sensitive-accept' not in participant:
                      raise AssertionError('Percurso ampliado ainda ausente da prévia')
                  if 'microphone=(self)' not in policy or 'microphone=()' in policy:
                      raise AssertionError('Política de microfone do percurso não foi aplicada corretamente: '+policy)
                  with urllib.request.urlopen(base+'/nexo-profissional/',timeout=14) as r:
                      other=r.headers.get('Permissions-Policy','')
                  if 'microphone=()' not in other:
                      raise AssertionError('Microfone não está bloqueado nas demais áreas')
                  print('Prévia confirmou temas opcionais, autorização específica e permissão restrita de microfone.')
                  break
              except Exception as error:
                  if getattr(error, 'code', None) == 403:
                      print('::warning::Acesso ao percurso clínico restrito (403). Validação externa não realizada; não contornar proteção. Conferir manualmente com convite autorizado.')
                      break
                  print(f'Tentativa {attempt}: {error}')
                  if attempt==6: raise
                  time.sleep(8)
          PY
